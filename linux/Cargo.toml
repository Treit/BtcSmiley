[package]
name = "btcsmiley"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "A Bitcoin price indicator for the Linux desktop"

[[bin]]
name = "btcsmiley"
path = "src/main.rs"
test = false

[dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }
